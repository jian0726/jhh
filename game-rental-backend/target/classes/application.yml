server:
  port: 8080
  # 可选：解决端口冲突或绑定问题
  address: 0.0.0.0
  error:
    include-message: always
    include-binding-errors: always

spring:
  datasource:
    # 敏感配置一律走环境变量，冒号后为「本地开发默认值」。
    # 生产环境请通过环境变量覆盖：DB_URL / DB_USERNAME / DB_PASSWORD
    url: ${DB_URL:jdbc:mysql://localhost:3306/sanJiaoZhouXingDong?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # 可选：添加连接测试查询
      connection-test-query: SELECT 1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    # SQL 日志默认关闭，需要排查时用 SQL_LOG_LEVEL=debug 打开
    show-sql: ${SQL_SHOW:false}
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # 禁用 JMX 以减少 RMI 警告
  jmx:
    enabled: false

  # 可选：Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  # 可选：文件上传配置（如果需要）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

jwt:
  # 生产环境必须通过环境变量 JWT_SECRET 覆盖（长度需 >= 32 字节）
  secret: ${JWT_SECRET:DeltaRentalPlatformSecretKey2024ForJWTTokenGeneration}
  # 令牌有效期（毫秒），默认 24 小时
  expiration: ${JWT_EXPIRATION:86400000}

app:
  # 允许跨域的来源，逗号分隔。本地开发默认全放开；
  # 生产环境请改为具体前端域名，例如 CORS_ALLOWED_ORIGINS=https://delta.example.com
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:*}
  # 定时任务：关闭超时未支付订单、租期到期自动完成、清理过期验证码、资金待办提醒
  scheduled:
    enabled: ${SCHEDULED_ENABLED:true}
    # 应用启动后延迟多久才开始跑任务（毫秒）
    initial-delay-ms: 120000
    # 未支付订单的超时阈值（分钟）
    unpaid-order-timeout-minutes: 30
    # 关闭超时订单的执行间隔（毫秒，默认 5 分钟）
    close-unpaid-interval-ms: 300000
    # 租期到期自动完成的执行间隔（毫秒，默认 10 分钟）
    finish-expired-interval-ms: 600000
    # 资金申请挂起告警阈值（天）与执行时间（默认每天 10:00）
    stale-pending-days: 3
    stale-pending-cron: "0 0 10 * * *"
  # 演示数据开关：仅在对应表为空时写入演示商品/轮播（不会覆盖已有数据），
  # 本地开发与答辩演示可直接保留；正式环境请设为 false。
  seed-demo: ${SEED_DEMO:true}
  # 演示数据归属的卖家用户 id（默认 admin = 1）
  # seed-demo-mai-jia-id: 1
  # 图片上传目录：默认使用「运行目录/uploads」，本地开发一般无需配置；
  # 部署到服务器时建议指向一个独立的数据盘目录，便于备份与迁移。
  # upload-dir: /data/delta/uploads

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    # 可选：Swagger 配置
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

logging:
  level:
    # 置为 debug 可查看 Hibernate 打印的 SQL（show-sql 关闭时的替代方案）
    org.hibernate.SQL: ${SQL_LOG_LEVEL:info}
