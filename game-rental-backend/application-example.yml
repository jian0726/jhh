# 第三方登录配置
third-party:
  wechat:
    app-id: your_wechat_app_id
    app-secret: your_wechat_app_secret
    redirect-uri: http://localhost:8080/api/oauth/callback?type=wechat
  qq:
    app-id: your_qq_app_id
    app-key: your_qq_app_key
    redirect-uri: http://localhost:8080/api/oauth/callback?type=qq

# 易宝支付配置
yeepay:
  merchant-id: your_yeepay_merchant_id
  secret-key: your_yeepay_secret_key
  notify-url: http://localhost:8080/api/yeepay/notify
  return-url: http://localhost:8080/api/yeepay/return
  gateway-url: https://api.yeepay.com
  version: 1.0

# 芝麻信用分配置
alipay:
  credit:
    app-id: your_alipay_app_id
    private-key: your_alipay_private_key
    public-key: your_alipay_public_key
    gateway-url: https://openapi.alipay.com/gateway.do
    return-url: http://localhost:8080/api/alipay-credit/return
    sign-type: RSA2
    charset: UTF-8

# 微信支付分配置
wechat:
  score:
    app-id: your_wechat_app_id
    mch-id: your_wechat_mch_id
    api-key: your_wechat_api_key
    app-secret: your_wechat_app_secret
    notify-url: http://localhost:8080/api/wechat-score/notify
    service-id: your_wechat_score_service_id

# 数据库配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sanJiaoZhouXingDong?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver

# JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /